[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback — serve index.html para qualquer rota client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
